[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cko-local-finder"
version = "0.1.0"
description = "Local Knowledge Finder package foundation and contract skeleton"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cko_local_finder*"]
exclude = ["tests*", "fixtures*", "reports*", "external*"]

[tool.setuptools.package-data]
cko_local_finder = ["py.typed"]
